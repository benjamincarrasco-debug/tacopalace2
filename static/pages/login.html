<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taco Palace - Acceso</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="desktop-app">
    <div class="auth-split-container">
      <div class="auth-hero-side">
        <div class="logo-circle" style="margin: 0 auto 16px; width: 48px; height: 48px;">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        </div>
        <h2>Bienvenido a Taco Palace</h2>
        <p style="margin-top: 8px;">Tu próxima orden empieza aquí.</p>
      </div>

      <div class="auth-form-side">
        <h2 id="auth-title">Registrarse</h2>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">Entra con tu cuenta y sigue disfrutando.</p>

        <form onsubmit="event.preventDefault(); handleAuth();">
          <div style="margin-bottom: 14px;">
            <label style="font-size: 0.85rem; font-weight: 600;">Correo electrónico</label>
            <div class="input-box">
              ✉️ <input type="email" id="email" value="tu@correo.com" required>
            </div>
          </div>

          <div style="margin-bottom: 14px;">
            <label style="font-size: 0.85rem; font-weight: 600;">Contraseña</label>
            <div class="input-box">
              🔒 <input type="password" id="password" value="********" required>
              <button type="button" onclick="togglePassword('password')" style="background:none; border:none; cursor:pointer;">👁️</button>
            </div>
          </div>

          <div id="confirm-pass-group" style="margin-bottom: 14px;">
            <label style="font-size: 0.85rem; font-weight: 600;">Confirmar contraseña</label>
            <div class="input-box">
              🔒 <input type="password" id="confirm-password" value="********">
              <button type="button" onclick="togglePassword('confirm-password')" style="background:none; border:none; cursor:pointer;">👁️</button>
            </div>
          </div>

          <div style="display: flex; gap: 12px; margin-bottom: 20px;">
            <label style="font-size: 0.85rem;"><input type="checkbox" onchange="toggleBothPasswords(this)"> Mostrar contraseña</label>
            <label style="font-size: 0.85rem;"><input type="checkbox" checked> Recordarme</label>
          </div>

          <button type="submit" class="btn btn-soft btn-full">Entrar</button>
          <a href="../../index.html" class="btn btn-outline btn-full" style="margin-top: 8px;">Volver</a>

          <div style="margin-top: 20px; text-align: center; font-size: 0.85rem;">
            <span id="toggle-msg">¿Ya tienes una cuenta?</span>
            <button type="button" id="toggle-mode-btn" onclick="switchAuthMode()" style="background:none; border:none; color:#dc2626; font-weight:700; cursor:pointer; margin-left: 4px;">Iniciar sesión</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="../js/script.js"></script>
</body>
</html>
